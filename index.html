<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI융합 교육과 피지컬 컴퓨팅 · 자료 다운로드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --ink: #222;
    --muted: #6b7280;
    --line: #e3e3e3;
    --hero-1: #2b3238;
    --hero-2: #3a454d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: #fff;
  }

  /* ---------- 헤더 ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--hero-1), var(--hero-2));
    color: #fff;
    text-align: center;
    padding: 48px 20px 52px;
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* 배경의 각진 면 */
  .hero::before {
    background:
      linear-gradient(115deg, rgba(255,255,255,.05) 0 30%, transparent 30%),
      linear-gradient(245deg, rgba(0,0,0,.12) 0 22%, transparent 22%);
  }
  .hero::after {
    background:
      linear-gradient(60deg, transparent 70%, rgba(255,255,255,.04) 70%),
      linear-gradient(300deg, transparent 80%, rgba(0,0,0,.1) 80%);
  }
  .hero h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    font-weight: 300;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  /* ---------- 본문 ---------- */
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 28px 100px;
    margin-bottom: 56px;
  }
  .row.small { gap: 28px 24px; }

  .card h2 {
    margin: 0 0 16px 6px;
    font-size: 24px;
    font-weight: 400;
  }
  .frame {
    border: 1px solid var(--line);
    background: #fff;
  }
  .frame iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .card.large .frame { width: 292px; height: 210px; }
  .card.small .frame { width: 134px; height: 182px; }

  .open-link {
    display: inline-block;
    margin: 8px 0 0 4px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
  }
  .open-link:hover { color: #1a73e8; text-decoration: underline; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 0 20px 40px;
  }

  @media (max-width: 640px) {
    .row { gap: 28px; justify-content: center; }
    .card.large .frame { width: min(92vw, 360px); }
  }
</style>
</head>
<body>

<header class="hero">
  <h1>AI융합 교육과<br>피지컬 컴퓨팅</h1>
</header>

<main>
  <!-- 사진 자료 -->
  <section class="row">
    <div class="card large">
      <h2>고양이 사진 다운로드</h2>
      <div class="frame">
        <iframe src="https://drive.google.com/embeddedfolderview?id=1VNcif_R_43TzKZ1lfkY5BLFRM0xFgyEk#list" title="고양이 사진 폴더" loading="lazy"></iframe>
      </div>
      <a class="open-link" href="https://drive.google.com/drive/folders/1VNcif_R_43TzKZ1lfkY5BLFRM0xFgyEk" target="_blank" rel="noopener">폴더 전체 열기 ↗</a>
    </div>

    <div class="card large">
      <h2>호랑이 사진 다운로드</h2>
      <div class="frame">
        <iframe src="https://drive.google.com/embeddedfolderview?id=1culz9NWd2QizSatSS6Ef9FelpmKzAB4D#list" title="호랑이 사진 폴더" loading="lazy"></iframe>
      </div>
      <a class="open-link" href="https://drive.google.com/drive/folders/1culz9NWd2QizSatSS6Ef9FelpmKzAB4D" target="_blank" rel="noopener">폴더 전체 열기 ↗</a>
    </div>
  </section>

  <!-- 색상 자료 -->
  <section class="row small">
    <div class="card small">
      <h2>빨강색</h2>
      <div class="frame">
        <iframe src="https://drive.google.com/embeddedfolderview?id=1JrBkvva9aa9P-zSrexlVCU22oj3jtEGk#list" title="빨강 폴더" loading="lazy"></iframe>
      </div>
    </div>

    <div class="card small">
      <h2>노랑색</h2>
      <div class="frame">
        <iframe src="https://drive.google.com/embeddedfolderview?id=10DPcwYtx_yrg4Cg44EOdwoUQjT5-h63p#list" title="노랑 폴더" loading="lazy"></iframe>
      </div>
    </div>

    <div class="card small">
      <h2>초록색</h2>
      <div class="frame">
        <iframe src="https://drive.google.com/embeddedfolderview?id=1SKTeG8olqXzVp9CGv5jVUSV0eMKhXvJv#list" title="초록 폴더" loading="lazy"></iframe>
      </div>
    </div>
  </section>
</main>

<footer>파일 이름을 누르면 구글 드라이브에서 열리며, 다운로드 버튼으로 받을 수 있습니다.</footer>

</body>
</html>
